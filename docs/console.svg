<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .win   { fill: #0F1620; stroke: #26323B; stroke-width: 1.4; }
      .bar   { fill: #0F1620; }
      .panel { fill: #141C24; stroke: #26323B; stroke-width: 1.2; }
      .rowln { fill: #141C24; stroke: #26323B; stroke-width: 1; }
      .brand { font-size: 17px; font-weight: 700; fill: #E6ECF0; }
      .k     { font-size: 11px; fill: #8A97A3; }
      .chip  { fill: #1E2A32; stroke: #2B3843; stroke-width: 1; }
      .chipt { font: 12px ui-monospace, Menlo, monospace; fill: #CBD5E1; }
      .fold  { font-size: 14px; font-weight: 600; fill: #E6ECF0; }
      .hint  { font-size: 12px; fill: #8A97A3; }
      .mono  { font: 12px ui-monospace, Menlo, monospace; fill: #8A97A3; }
      .what  { font-size: 13px; fill: #E6ECF0; }
      .btn   { fill: #0A6E5C; }
      .btnt  { font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
      .btno  { fill: #1B252C; stroke: #3A4752; stroke-width: 1; }
      .btnot { font-size: 12px; fill: #CBD5E1; }
      .sel   { fill: #1B252C; stroke: #3A4752; stroke-width: 1; }
      .selt  { font-size: 12px; fill: #CBD5E1; }
      .badge { stroke-width: 1; }
      .brun  { fill: #11302B; stroke: #4FD1B0; } .brunt { font-size: 11.5px; font-weight: 600; fill: #4FD1B0; }
      .bpass { fill: #141C24; stroke: #4ADE80; } .bpasst { font-size: 11.5px; font-weight: 600; fill: #4ADE80; }
      .bwait { fill: #141C24; stroke: #3A4752; } .bwaitt { font-size: 11.5px; font-weight: 600; fill: #8A97A3; }
      .code  { fill: #0A0E13; }
      .cl    { font: 12px ui-monospace, Menlo, monospace; fill: #E2E8F0; }
      .cmark { font: 12px ui-monospace, Menlo, monospace; fill: #93C5FD; }
      .cok   { font: 12px ui-monospace, Menlo, monospace; fill: #6EE7B7; }
      .status{ fill: #0F1620; stroke: #26323B; stroke-width: 1; }
      .trow  { fill: #0A0E13; stroke: #26323B; stroke-width: 1; }
      .th    { fill: #1B252C; }
      .tht   { font-size: 11.5px; font-weight: 600; fill: #CBD5E1; }
      .tdk   { font: 12px ui-monospace, Menlo, monospace; fill: #E2E8F0; }
      .tdv   { font: 12px ui-monospace, Menlo, monospace; fill: #CBD5E1; }
      .keyrow{ fill: #0F1620; }
      .keysel{ fill: #152030; stroke: #2B3843; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1100" height="700" rx="14" fill="#0A0F14"/>
  <rect x="16" y="14" width="1068" height="672" rx="12" class="win"/>

  <!-- top bar -->
  <rect x="17" y="15" width="1066" height="46" rx="12" class="bar"/>
  <line x1="17" y1="61" x2="1083" y2="61" stroke="#26323B" stroke-width="1.2"/>
  <text x="40" y="44" class="brand">⚡ dynamoredis console</text>
  <text x="270" y="36" class="k">Endpoint</text>
  <rect x="270" y="41" width="230" height="14" rx="7" class="chip"/>
  <text x="278" y="52" class="chipt">dynamoredis-...lambda-url.aws</text>
  <text x="530" y="36" class="k">Signed in</text>
  <rect x="530" y="41" width="60" height="14" rx="7" class="chip"/>
  <text x="538" y="52" class="chipt">admin</text>
  <rect x="990" y="30" width="78" height="22" rx="6" class="btno"/>
  <text x="1029" y="45" text-anchor="middle" class="btnot">sign out</text>

  <!-- Redis command panel -->
  <rect x="40" y="78" width="1020" height="198" rx="10" class="panel"/>
  <text x="58" y="104" class="fold">Redis command</text>
  <text x="166" y="104" class="hint">one command per line, run in order</text>
  <rect x="52" y="114" width="996" height="80" rx="8" class="code"/>
  <text x="66" y="136" class="cl">SET greeting hello EX 600</text>
  <text x="66" y="156" class="cl">HSET user:1 name alice age 30 email alice@example.com</text>
  <text x="66" y="176" class="cl">ZADD board 10 alice 20 bob</text>
  <rect x="52" y="204" width="86" height="26" rx="6" class="btn"/>
  <text x="95" y="221" text-anchor="middle" class="btnt">▶ Run</text>
  <text x="150" y="221" class="hint">⌘/Ctrl+Enter runs</text>
  <rect x="962" y="204" width="86" height="26" rx="6" class="btno"/>
  <text x="1005" y="221" text-anchor="middle" class="btnot">history</text>
  <rect x="52" y="236" width="996" height="34" rx="8" class="code"/>
  <text x="66" y="252" class="cmark">&gt; ZADD board 10 alice 20 bob</text>
  <text x="66" y="265" class="cok">[2026-11-22 10:42:07] (integer) 2  · 12 ms (server 4 ms, 1 CU)</text>

  <!-- keys controls -->
  <text x="40" y="304" class="fold">keys</text>
  <rect x="90" y="290" width="320" height="24" rx="6" class="sel"/>
  <text x="102" y="306" class="mono">user:*</text>
  <rect x="424" y="289" width="96" height="26" rx="6" class="btno"/>
  <text x="472" y="306" text-anchor="middle" class="btnot">↻ refresh</text>
  <text x="540" y="306" class="hint">42 keys · 2 CU</text>

  <!-- key browser + detail -->
  <rect x="40" y="326" width="1020" height="320" rx="10" class="panel"/>

  <!-- left: key tree -->
  <rect x="52" y="338" width="320" height="296" rx="8" class="rowln"/>
  <!-- row: user (open folder) -->
  <rect x="53" y="339" width="318" height="28" class="keyrow"/>
  <text x="66" y="357" class="hint">⌄</text>
  <text x="84" y="357" class="what">▸ user</text>
  <text x="326" y="357" class="hint">48%</text>
  <text x="360" y="357" text-anchor="end" class="mono">20</text>
  <!-- key: user:1 (selected) -->
  <rect x="53" y="367" width="318" height="28" class="keysel"/>
  <text x="104" y="385" class="what">◦ 1</text>
  <!-- key: user:2 -->
  <text x="104" y="413" class="what">◦ 2</text>
  <!-- row: session (closed folder) -->
  <text x="66" y="441" class="hint">›</text>
  <text x="84" y="441" class="what">▸ session</text>
  <text x="332" y="441" class="hint">7%</text>
  <text x="360" y="441" text-anchor="end" class="mono">3</text>
  <!-- key: board -->
  <text x="84" y="469" class="what">◦ board</text>
  <!-- key: greeting -->
  <text x="84" y="497" class="what">◦ greeting</text>
  <line x1="53" y1="367" x2="371" y2="367" stroke="#1E2A32" stroke-width="1"/>
  <line x1="53" y1="395" x2="371" y2="395" stroke="#1E2A32" stroke-width="1"/>
  <line x1="53" y1="423" x2="371" y2="423" stroke="#1E2A32" stroke-width="1"/>
  <line x1="53" y1="451" x2="371" y2="451" stroke="#1E2A32" stroke-width="1"/>
  <line x1="53" y1="479" x2="371" y2="479" stroke="#1E2A32" stroke-width="1"/>

  <!-- right: key detail -->
  <text x="394" y="357" class="what" font-weight="600">user:1</text>
  <rect x="452" y="345" width="52" height="18" rx="9" class="chip"/>
  <text x="478" y="358" text-anchor="middle" class="chipt">hash</text>
  <text x="516" y="357" class="hint">no expiry · 1 CU</text>
  <rect x="966" y="344" width="82" height="22" rx="6" class="btno"/>
  <text x="1007" y="359" text-anchor="middle" class="btnot">delete</text>
  <!-- table -->
  <rect x="384" y="374" width="664" height="30" rx="6" class="th"/>
  <text x="398" y="393" class="tht">field</text>
  <text x="640" y="393" class="tht">value</text>
  <rect x="384" y="404" width="664" height="30" class="trow"/>
  <text x="398" y="423" class="tdk">name</text>
  <text x="640" y="423" class="tdv">"alice"</text>
  <rect x="384" y="434" width="664" height="30" class="trow"/>
  <text x="398" y="453" class="tdk">age</text>
  <text x="640" y="453" class="tdv">"30"</text>
  <rect x="384" y="464" width="664" height="30" class="trow"/>
  <text x="398" y="483" class="tdk">email</text>
  <text x="640" y="483" class="tdv">"alice@example.com"</text>

  <!-- status bar -->
  <rect x="17" y="654" width="1066" height="32" rx="12" class="status"/>
  <text x="40" y="674" class="mono" fill="#4FD1B0">[10:42:07] HSET user:1 name alice age 30 email ... → (integer) 1 · 1 CU</text>
  <text x="1060" y="674" text-anchor="end" class="mono">dynamoredis 0.1.2</text>
</svg>
