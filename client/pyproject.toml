[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project"           # <project>: repo = pip = import name
version = "0.1.0"
description = "A truly serverless <replaces> on your own AWS account: <built on>, ≈ $0 when idle. Client named after the standard one: <project>.<client>."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "aws", "lambda", "<replaces>"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/cloudformer/<project>"
Repository = "https://github.com/cloudformer/<project>"
Deploy = "https://github.com/cloudformer/<project>#quick-start"
Compatibility = "https://github.com/cloudformer/<project>/blob/main/tests/compat/REPORT.md"
Changelog = "https://github.com/cloudformer/<project>/blob/main/CHANGELOG.md"
Issues = "https://github.com/cloudformer/<project>/issues"

[tool.setuptools]
packages = ["project"]     # rename the directory client/project/ to client/<project>/
