AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  dynamoredis - a truly serverless Redis: Lambda Function URL endpoint + console, one DynamoDB table,
  ~$0 when idle. Same resources as terraform/main.tf.

# Deploy (AWS CLI only):
#   aws cloudformation package --template-file cloudformation/template.yaml \
#       --s3-bucket <any-bucket-you-own> --output-template-file /tmp/dynamoredis.yaml
#   aws cloudformation deploy --template-file /tmp/dynamoredis.yaml --stack-name dynamoredis \
#       --capabilities CAPABILITY_IAM --parameter-overrides file://cloudformation/params.json

Parameters:
  Env:
    Type: String
    Default: dev
  UserName:
    Type: String
    Default: admin
    Description: The service's user (HTTP Basic; redis-py username=)
  Password:
    Type: String
    NoEcho: true
  EndpointAuth:
    Type: String
    Default: NONE
    AllowedValues: [NONE, AWS_IAM]
    Description: NONE = public URL, only user/password is checked. AWS_IAM = SigV4 + IAM first (no browser console).
  Console:
    Type: String
    Default: "1"
    AllowedValues: ["1", "0"]
    Description: Serve the built-in web console at GET / ("0" = API only)

Conditions:
  PublicEndpoint: !Equals [!Ref EndpointAuth, NONE]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: k, AttributeType: S }
      KeySchema:
        - { AttributeName: k, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: exp
        Enabled: true

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                         dynamodb:BatchWriteItem, dynamodb:BatchGetItem, dynamodb:Scan, dynamodb:Query]
                Resource: !GetAtt Table.Arn

  Server:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-lambda"
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code: ../src/server
      Environment:
        Variables:
          TABLE: !Ref Table
          USER_NAME: !Ref UserName
          PASSWORD: !Ref Password
          CONSOLE: !Ref Console

  ServerUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Server.Arn
      AuthType: !Ref EndpointAuth
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: [content-type, authorization]

  ServerUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: PublicEndpoint
    Properties:
      FunctionName: !Ref Server
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ServerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: PublicEndpoint
    Properties:
      FunctionName: !Ref Server
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ConsoleUrl:
    Value: !GetAtt ServerUrl.FunctionUrl
  Table:
    Value: !Ref Table
