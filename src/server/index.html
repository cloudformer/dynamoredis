<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dynamoredis console</title>
<style>
/* 风格参考 Automation_Delivery_EaC 的 db 页面 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
  min-height: 100vh;
  padding: 40px 20px;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  background: white;
  border-radius: 15px;
  padding: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 { color: #333; margin-bottom: 10px; }
/* 顶部信息行:Endpoint 固定在前,Database 在后(定宽,切库不抖),退出靠右 */
.db-info {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  margin: 6px 0 24px; font-size: 13px;
}
.db-info .meta { display: inline-flex; align-items: center; gap: 8px; }
.db-info .k {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: #9ca3af;
}
.chip {
  background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px;
  padding: 4px 10px; color: #374151; font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
/* 定宽,像 format 的固定列:内容长短变化不影响后面元素的位置 */
#info-db { width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 输出日志(DataGrip 风格) */
.log {
  background: #1f2937; color: #d1d5db; border-radius: 8px;
  padding: 10px 14px; margin: 12px 0 0; max-height: 200px; overflow: auto;
  font: 12px/1.7 ui-monospace, 'Courier New', monospace; white-space: pre-wrap;
}
.log:empty { display: none; }
.log.expanded { max-height: 360px; }
.log .sep { border-top: 1px dashed #4b5563; margin: 6px 0; }
.log .sql { color: #93c5fd; }
.log .ok  { color: #86efac; }
.log .err { color: #fca5a5; }

/* Controls */
.controls { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
.controls label { font-size: 14px; font-weight: 600; color: #4b5563; }
.controls select {
  padding: 10px 15px; border: 2px solid #e5e7eb; border-radius: 6px;
  font-size: 14px; min-width: 180px; background: white;
}
.btn {
  padding: 10px 20px; border: none; border-radius: 6px;
  font-weight: 600; cursor: pointer; transition: all .3s; font-size: 14px;
}
.btn-primary   { background: #10b981; color: white; }
.btn-primary:hover { background: #059669; }
.btn-secondary { background: #667eea; color: white; }
.btn-secondary:hover { background: #5568d3; }
.btn-ghost { background: white; color: #374151; border: 2px solid #e5e7eb; }
.btn-ghost:hover { border-color: #667eea; color: #667eea; }
.btn-danger {
  background: #ef4444; color: white; padding: 5px 10px;
  border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
}
.btn-danger:hover { background: #dc2626; }
.btn-small { padding: 5px 10px; font-size: 12px; border-radius: 4px; }

/* Table section */
.table-section {
  margin: 30px 0; border: 2px solid #e5e7eb; border-radius: 10px;
  padding: 20px; background: #f8fafc;
}
.table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.table-name { font-size: 22px; font-weight: 600; color: #1f2937; }
.row-count {
  background: #10b981; color: white; padding: 6px 15px;
  border-radius: 20px; font-size: 14px; font-weight: 600;
}
.section-title {
  font-size: 16px; font-weight: 600; color: #4b5563; margin: 20px 0 10px 0;
  display: flex; align-items: center; gap: 10px;
}
table {
  width: 100%; border-collapse: collapse; background: white;
  border-radius: 8px; overflow: hidden; margin-bottom: 20px;
}
th {
  background: #374151; color: white; padding: 12px; text-align: left;
  font-weight: 600; font-size: 14px; white-space: nowrap;
}
td {
  padding: 10px 12px; border-bottom: 1px solid #e5e7eb;
  font-size: 14px; color: #374151; max-width: 420px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fafb; }
td.null { color: #9ca3af; font-style: italic; }
td input {
  width: 100%; min-width: 80px; padding: 6px 8px;
  border: 2px solid #e5e7eb; border-radius: 4px; font-size: 13px;
}

/* Add form */
.add-form {
  background: #f0fdf4; border: 2px solid #10b981; border-radius: 8px;
  padding: 20px; margin: 20px 0;
}
.add-form h3 { color: #065f46; margin-bottom: 15px; font-size: 18px; }
.form-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px; margin-bottom: 15px;
}
.form-field label {
  display: block; font-size: 13px; font-weight: 600;
  color: #374151; margin-bottom: 5px;
}
.form-field input {
  width: 100%; padding: 8px; border: 2px solid #e5e7eb;
  border-radius: 4px; font-size: 14px;
}
.form-field small { color: #6b7280; font-size: 12px; }

/* Pagination */
.pagination { display: flex; gap: 10px; justify-content: center; align-items: center; margin: 20px 0 0; }
.pagination button, .pagination span {
  padding: 8px 12px; border-radius: 6px; font-size: 14px;
  color: #374151; background: white; border: 2px solid #e5e7eb;
}
.pagination button { cursor: pointer; }
.pagination button:hover:not(:disabled) { background: #667eea; color: white; border-color: #667eea; }
.pagination button:disabled { opacity: .5; cursor: not-allowed; }
.pagination .current { background: #667eea; color: white; border-color: #667eea; font-weight: 600; }

.empty { padding: 40px; text-align: center; color: #9ca3af; }

/* SQL console */
.sql-section {
  margin: 20px 0; border: 2px solid #e5e7eb; border-radius: 10px;
  padding: 20px; background: #f8fafc;
}
.sql-section textarea {
  width: 100%; height: 90px; resize: vertical; padding: 12px;
  border: 2px solid #e5e7eb; border-radius: 6px; font-size: 14px;
  font-family: ui-monospace, 'Courier New', monospace;
}
.sql-actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.hint { font-size: 12px; color: #6b7280; }

/* 页内模态框(不用浏览器 prompt,避免被"阻止对话框"机制吞掉) */
dialog {
  border: none; border-radius: 10px; padding: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3); min-width: 340px; max-width: 90vw;
  position: fixed; inset: 0; margin: auto;   /* centred in the viewport, whatever the page scroll */
}
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h3 { margin-bottom: 15px; color: #1f2937; font-size: 17px; }
dialog .form-grid { grid-template-columns: 1fr; }
@media (max-width: 640px){ .container { padding: 20px; } body { padding: 16px; } }
#keys{border:1px solid #dfe3e8;border-radius:8px;overflow:hidden;background:#fff}
#keys .row{display:flex;align-items:center;gap:6px;height:30px;padding-right:10px;border-bottom:1px solid #eef0f3;cursor:pointer;font-size:12.5px;color:#2a3344;white-space:nowrap}
#keys .row:hover{background:#f5f7fa} #keys .row.sel{background:#e9f0fb}
#keys .chev{width:10px;color:#6b7482;font-size:13px;line-height:1} #keys .ico{display:flex;color:#5b6b85}
#keys .name{flex:1;overflow:hidden;text-overflow:ellipsis} #keys .pct{width:40px;text-align:right;color:#6b7482;font-size:11.5px}
#keys .num{width:48px;text-align:right;color:#2a3344;font-size:11.5px} #keys .key .name{font-family:Menlo,monospace;font-size:12px}
#detail .empty{color:#6b7482;text-align:center;padding:80px 20px;border:1px solid #dfe3e8;border-radius:8px;background:#fff}
pre{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ dynamoredis console</h1>
  <div class="db-info">
    <span class="meta"><span class="k">Endpoint</span><span class="chip" id="info-host">-</span></span>
    <button class="btn btn-ghost btn-small" id="logout">sign out</button>
  </div>

  <div class="sql-section">
    <div class="section-title">Redis command</div>
    <textarea id="cmd" placeholder="one command per line:&#10;SET greeting hello EX 600&#10;HSET user:1 name alice age 30&#10;ZADD board 10 alice 20 bob&#10;KEYS user:*"></textarea>
    <div class="sql-actions">
      <button class="btn btn-primary" id="run">▶ Run</button>
      <span class="hint">⌘/Ctrl+Enter runs</span>
      <span style="flex:1"></span>
      <button class="btn btn-ghost btn-small" id="togglelog">history</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="controls">
    <label>keys</label><input id="match" placeholder="prefix* (SCAN MATCH)" style="flex:1;max-width:320px">
    <button class="btn btn-secondary" id="refresh">↻ refresh</button>
    <button class="btn btn-ghost" id="more" hidden>more…</button>
    <span class="hint" id="count"></span>
  </div>
  <div id="main" style="display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:16px">
    <div id="keys"></div>
    <div id="detail"><div class="empty">Select a key from the list on the left to see its value</div></div>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgtitle"></h3>
    <div class="form-grid" id="dlgbody"></div>
    <div class="sql-actions">
      <button class="btn btn-primary" value="ok">OK</button>
      <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>

<script>
// ---------------- shared shell: credentials, dialog, log, api() ----------------
const $ = s => document.querySelector(s);
const KEY = 'dynamoredis_';                       // localStorage prefix: only the credential is kept
const store = {
  get: k => { try { return localStorage.getItem(KEY + k); } catch(e){ return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(KEY + k) : localStorage.setItem(KEY + k, v); } catch(e){} },
};
let cred = store.get('cred') || '';
function saveCred(c){ cred = c; store.set('cred', c || null); }
$('#info-host').textContent = location.host;

// in-page dialog (browsers suppress prompt() inside Lambda URL pages)
function dialog(title, fields){
  return new Promise(resolve => {
    $('#dlgtitle').textContent = title;
    $('#dlgbody').innerHTML = fields.map(f =>
      `<label>${f.label}</label><input name="${f.name}" type="${f.type || 'text'}" value="${f.value || ''}" ${f.required ? 'required' : ''}>`).join('');
    const d = $('#dlg');
    d.onclose = () => resolve(d.returnValue === 'ok' ? Object.fromEntries(new FormData(d.querySelector('form'))) : null);
    d.showModal();
    const first = d.querySelector('input'); if (first) first.focus();
  });
}
async function askCred(){
  const r = await dialog('Sign in', [{label: 'user', name: 'u', required: true}, {label: 'password', name: 'p', type: 'password', required: true}]);
  if (!r) return false;
  saveCred(btoa(r.u + ':' + r.p));
  return true;
}

// log pane: one line per call, with the server's own timing
const logLines = [];
let logOpen = false;
function ts(){ return new Date().toISOString().replace('T', ' ').slice(0, 19); }
function log(text, cls){ logLines.push({text, cls}); renderLog(); }
function renderLog(){
  const el = $('#log');
  const lines = logOpen ? logLines : logLines.slice(-3);
  el.innerHTML = lines.map(l => `<div class="${l.cls || ''}">${esc(l.text)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
$('#togglelog').onclick = () => { logOpen = !logOpen; renderLog(); };

// every API call goes through here: Basic auth, 401 -> sign in again, errors -> log
async function api(path, opts = {}){
  if (!cred && !(await askCred())) throw new Error('not signed in');
  const r = await fetch(path, Object.assign({}, opts, {
    headers: Object.assign({'content-type': 'application/json', 'authorization': 'Basic ' + cred}, opts.headers || {})}));
  if (r.status === 401){ saveCred(''); if (await askCred()) return api(path, opts); throw new Error('not signed in'); }
  const data = await r.json().catch(() => ({error: 'bad response'}));
  if (!r.ok){ log(`[${ts()}] ${data.error || r.status}`, 'err'); throw new Error(data.error || r.status); }
  return data;
}
$('#logout').onclick = () => { saveCred(''); location.reload(); };

// ---------------- dynamoredis: command box, key browser, key detail ----------------
const state = {match: '', cursor: '0', keys: [], selected: null};

// "SET k v" -> ["SET", "k", "v"]; quotes group words
function tokens(line){
  const out = []; const re = /"([^"]*)"|'([^']*)'|(\S+)/g; let m;
  while ((m = re.exec(line))) out.push(m[1] ?? m[2] ?? m[3]);
  return out;
}
function show(v){
  if (v === null) return '(nil)';
  if (v === true) return 'OK';
  if (typeof v === 'object' && !Array.isArray(v)) return v.$b ? `<binary ${v.$b.length} b64>` : JSON.stringify(v);
  return typeof v === 'string' ? JSON.stringify(v) : String(v);
}
async function run(){
  const lines = $('#cmd').value.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  if (!lines.length) return;
  for (const line of lines){            // one command per line, in order, like RedisInsight's workbench
    const t = tokens(line);
    log(`> ${line}`, 'sql');
    const t0 = performance.now();
    try {
      const d = await api('/api/cmd', {method: 'POST', body: JSON.stringify({cmd: t[0], args: t.slice(1)})});
      const r = d.result;
      const text = Array.isArray(r) ? (r.length ? r.map((x, i) => `${i + 1}) ${show(x)}`).join('\n') : '(empty)') : show(r);
      log(`[${ts()}] ${text}  · ${Math.round(performance.now() - t0)} ms (server ${d.ms} ms, ${d.cu} CU)`, 'ok');
    } catch (e) { /* api() logged it */ }
  }
  $('#cmd').value = '';
  loadKeys(true);
  if (state.selected) loadKey(state.selected);
}
$('#run').onclick = run;
$('#cmd').addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run(); });

const open = new Set();   // expanded namespaces ("user", "user:1" ...)
function tree(keys){
  // "a:b:c" -> nested folders by ":", like RedisInsight's browser; a key that is also a prefix keeps its leaf
  const root = {children: {}, keys: []};
  for (const k of keys){
    const parts = k.split(':');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++){
      node = node.children[parts[i]] ||= {children: {}, keys: []};
    }
    node.keys.push(k);
  }
  return root;
}
function count(node){ return node.keys.length + Object.values(node.children).reduce((n, c) => n + count(c), 0); }
const FOLDER = '<svg width="14" height="12" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 3.5h4l1.5 1.5h7.5v7h-13z"/></svg>';
const KEYICON = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="5" cy="5" r="3"/><path d="M7.2 7.2 12.5 12.5M10 10l1.5-1.5M11.5 11.5 13 10"/></svg>';
function renderNode(node, prefix, depth, total){
  let html = '';
  for (const name of Object.keys(node.children).sort()){
    const path = prefix ? prefix + ':' + name : name;
    const child = node.children[name];
    const isOpen = open.has(path);
    const n = count(child);
    const pct = total ? Math.round(100 * n / total) : 0;
    html += `<div class="row ns" data-ns="${esc(path)}" style="padding-left:${12 + depth * 18}px">
      <span class="chev">${isOpen ? '⌄' : '›'}</span><span class="ico">${FOLDER}</span><span class="name">${esc(name)}</span>
      <span class="pct">${pct < 1 ? '<1' : pct}%</span><span class="num">${n}</span></div>`;
    if (isOpen) html += renderNode(child, path, depth + 1, total);
  }
  for (const k of node.keys.sort()){
    const leaf = k.split(':').pop();
    html += `<div class="row key ${k === state.selected ? 'sel' : ''}" data-k="${esc(k)}" style="padding-left:${34 + depth * 18}px">
      <span class="ico">${KEYICON}</span><span class="name">${esc(leaf)}</span></div>`;
  }
  return html;
}
async function loadKeys(reset){
  if (reset){ state.cursor = '0'; state.keys = []; }
  const q = new URLSearchParams({match: state.match ? state.match + (state.match.endsWith('*') ? '' : '*') : '*', cursor: state.cursor, count: 100});
  const d = await api('/api/keys?' + q);
  state.keys = state.keys.concat(d.keys); state.cursor = d.cursor;
  $('#more').hidden = state.cursor === '0';
  $('#count').textContent = `${state.keys.length} keys · ${d.cu} CU`;
  $('#keys').innerHTML = state.keys.length ? renderNode(tree(state.keys), '', 0, state.keys.length) : '<div class="hint" style="padding:12px">no keys</div>';
  bindKeys();
}
function bindKeys(){
  document.querySelectorAll('#keys .ns').forEach(el => el.onclick = () => {
    const ns = el.dataset.ns; open.has(ns) ? open.delete(ns) : open.add(ns);
    $('#keys').innerHTML = renderNode(tree(state.keys), '', 0, state.keys.length); bindKeys();
  });
  document.querySelectorAll('#keys .key').forEach(el => el.onclick = () => loadKey(el.dataset.k));
}
$('#refresh').onclick = () => loadKeys(true);
$('#more').onclick = () => loadKeys(false);
$('#match').addEventListener('input', e => { state.match = e.target.value.trim(); loadKeys(true); });

function ttlText(t){ return t === -1 ? 'no expiry' : t === -2 ? 'gone' : `expires in ${t}s`; }
async function loadKey(k){
  state.selected = k;
  let d;
  try { d = await api('/api/key/' + encodeURIComponent(k)); }
  catch (e) { $('#detail').innerHTML = `<div class="hint">${esc(k)}: gone</div>`; loadKeys(true); return; }
  const v = d.value;
  let body;
  if (d.type === 'string') body = `<pre>${esc(show(v))}</pre>`;
  else if (d.type === 'hash') body = `<table><tr><th>field</th><th>value</th></tr>` + Object.entries(v).map(([f, x]) => `<tr><td>${esc(f)}</td><td>${esc(show(x))}</td></tr>`).join('') + `</table>`;
  else if (d.type === 'list') body = `<table><tr><th>#</th><th>value</th></tr>` + v.map((x, i) => `<tr><td>${i}</td><td>${esc(show(x))}</td></tr>`).join('') + `</table>`;
  else if (d.type === 'set') body = `<table><tr><th>member</th></tr>` + v.map(x => `<tr><td>${esc(show(x))}</td></tr>`).join('') + `</table>`;
  else body = `<table><tr><th>member</th><th>score</th></tr>` + v.map(([m, s]) => `<tr><td>${esc(m)}</td><td>${esc(s)}</td></tr>`).join('') + `</table>`;
  $('#detail').innerHTML = `<div class="section-title">${esc(k)} <span class="chip">${d.type}</span> <span class="hint">${ttlText(d.ttl)} · ${d.cu} CU</span>
      <button class="btn btn-ghost btn-small" id="del">delete</button></div>` + body;
  $('#del').onclick = async () => {
    if (!(await dialog(`Delete ${k}?`, []))) return;
    await api('/api/cmd', {method: 'POST', body: JSON.stringify({cmd: 'DEL', args: [k]})});
    log(`[${ts()}] DEL ${k}`, 'ok'); state.selected = null; $('#detail').innerHTML = '<div class="empty">Select a key from the list on the left to see its value</div>'; loadKeys(true);
  };
  loadKeys(true);
}
loadKeys(true).catch(() => {});
</script>
</body>
</html>
